name: WASM Size Report

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-size:
    name: Report WASM Binary Sizes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: wasm-size-${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            wasm-size-${{ runner.os }}-cargo-

      - name: Build wasm release
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Collect binary sizes
        id: sizes
        run: |
          WASM_DIR="target/wasm32-unknown-unknown/release"
          {
            echo "report<<WASM_EOF"
            echo "| Contract | Size |"
            echo "|----------|------|"
            for wasm in "$WASM_DIR"/*.wasm; do
              [ -f "$wasm" ] || continue
              name="$(basename "$wasm" .wasm)"
              # Skip build-script and dep artifacts (contain hyphens followed by hex)
              echo "$name" | grep -qE '^[a-f0-9]{16}' && continue
              size_bytes="$(wc -c < "$wasm")"
              if [ "$size_bytes" -ge 1048576 ]; then
                size="$(awk "BEGIN {printf \"%.2f MiB\", $size_bytes/1048576}")"
              else
                size="$(awk "BEGIN {printf \"%.1f KiB\", $size_bytes/1024}")"
              fi
              echo "| \`$name\` | $size |"
            done
            echo "WASM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        # Don't fail the CI job when the comment step can't post. PRs
        # opened from forks run with a read-only GITHUB_TOKEN (GitHub
        # security policy) so the comment API returns 403. The WASM
        # build itself already succeeded — the report is informational
        # only, not a gate, so skipping it silently on forks is fine.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          # Pass the multi-line report through an env var rather than
          # via `${{ steps... }}` substitution. Substitution inlines the
          # report text directly into the JavaScript source before it
          # runs, which breaks single-quoted string literals as soon as
          # the report spans more than one line (or contains quotes,
          # backticks, or backslashes). Reading from the env var keeps
          # the report an opaque string at runtime.
          REPORT: ${{ steps.sizes.outputs.report }}
        with:
          script: |
            const marker = '<!-- wasm-size-report -->';
            const report = process.env.REPORT || '(no report)';
            const body = [
              marker,
              '## WASM Binary Sizes',
              '',
              report,
              '',
              `_Built from \`${context.sha.slice(0, 8)}\` on \`${context.ref.replace('refs/heads/', '')}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
